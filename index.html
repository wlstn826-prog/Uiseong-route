<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기아 무브투유 - 지난주 리뷰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: linear-gradient(135deg, #e0f2f1 0%, #f0fdfa 100%); }
        .brand-teal { color: #14b8a6; }
        .brand-bg { background-color: #14b8a6; }
        .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card:hover { transform: translateY(-6px); }
    </style>
</head>
<body class="min-h-screen pb-20">

<div class="brand-bg text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-5 py-5 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-white rounded-2xl flex items-center justify-center text-2xl">🚚</div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight">기아 무브투유</h1>
                <p class="text-xs opacity-75 -mt-1">D-1 × 기아 × 소록우산</p>
            </div>
        </div>
        <div class="text-right">
            <p class="text-sm font-medium" id="week-title">2026. 5. 5(월) ~ 5. 11(일)</p>
            <p class="text-xs opacity-75">지난주 리뷰</p>
        </div>
    </div>
</div>

<div class="max-w-2xl mx-auto px-5 pt-6">

    <!-- 메인 탭 -->
    <div class="flex border-b border-teal-200 mb-6 bg-white rounded-3xl p-1 shadow">
        <button onclick="switchMainTab(0)" id="tab0-btn" class="flex-1 py-4 rounded-3xl font-medium bg-white shadow">요일별 특이사항</button>
        <button onclick="switchMainTab(1)" id="tab1-btn" class="flex-1 py-4 rounded-3xl font-medium text-gray-500">저번주 같은요일 판매</button>
    </div>

    <!-- 요일별 특이사항 -->
    <div id="main-tab0">
        <div class="grid grid-cols-7 gap-2 mb-8 text-center text-sm" id="day-tabs"></div>
        <div id="day-content"></div>
    </div>

    <!-- 판매 요약 -->
    <div id="main-tab1" class="hidden">
        <div id="sales-content"></div>
    </div>
</div>

<script>
// ==================== 데이터 로드 ====================
let notesData = {};
let salesData = {};

async function loadData() {
    try {
        const [notesRes, salesRes] = await Promise.all([
            fetch('data/special-notes.json'),
            fetch('data/sales-summary.json')
        ]);
        notesData = await notesRes.json();
        salesData = await salesRes.json();
        renderDayTabs();
        switchDay(0); // 월요일 기본
    } catch(e) {
        console.error("데이터 로드 실패", e);
        alert("data 폴더 안에 JSON 파일이 있는지 확인해주세요!");
    }
}

// ==================== 요일별 특이사항 렌더링 ====================
function renderDayTabs() {
    const container = document.getElementById('day-tabs');
    const days = ['월','화','수','목','금','토','일'];
    let html = '';
    days.forEach((day, i) => {
        html += `
            <div onclick="switchDay(${i})" id="day${i}" 
                 class="day-tab py-3 bg-white rounded-2xl font-medium cursor-pointer">
                ${day}
            </div>`;
    });
    container.innerHTML = html;
}

function switchDay(d) {
    document.querySelectorAll('.day-tab').forEach(el => el.classList.remove('border-2', 'border-teal-300', 'bg-teal-50'));
    document.getElementById(`day${d}`).classList.add('border-2', 'border-teal-300', 'bg-teal-50');

    const dayKey = ['mon','tue','wed','thu','fri','sat','sun'][d];
    const data = notesData[dayKey] || { visits: 0, notes: [] };

    let html = `
        <div class="mb-6 flex items-center gap-3">
            <div class="w-10 h-10 brand-bg text-white rounded-3xl flex items-center justify-center text-xl font-bold">0${d+5}</div>
            <div>
                <div class="font-bold text-xl">${['월','화','수','목','금','토','일'][d]}요일 · ${data.visits}마을</div>
            </div>
        </div>
        <div class="space-y-5">`;

    if (data.notes.length === 0) {
        html += `<div class="text-center py-12 text-gray-400">이번 요일 특이사항이 없습니다.</div>`;
    } else {
        data.notes.forEach(note => {
            const color = note.type === '특이사항' ? 'orange' : 'red';
            html += `
                <div class="card bg-white rounded-3xl p-6">
                    <div class="flex justify-between">
                        <span class="px-4 py-1.5 bg-${color}-100 text-${color}-700 text-sm font-medium rounded-2xl">${note.type}</span>
                        <span class="text-xs text-gray-400">${note.village} · ${note.time}</span>
                    </div>
                    <div class="mt-4 text-[15px] leading-relaxed">${note.content}</div>
                </div>`;
        });
    }
    html += `</div>`;
    document.getElementById('day-content').innerHTML = html;
}

// ==================== 판매 요약 ====================
function renderSales() {
    const html = `
        <div class="card bg-white rounded-3xl p-8 text-center">
            <div class="inline-flex items-center gap-2 text-teal-600 mb-2">
                <i class="fas fa-calendar"></i>
                <span class="font-medium">저번주 월요일</span>
            </div>
            <div class="text-6xl font-bold brand-teal mt-3">${salesData.mon?.total || 1248}</div>
            <div class="text-xl text-gray-500">만원</div>
            <div class="text-sm text-teal-600 mt-1">${salesData.mon?.villages || 7}마을 평균 ${salesData.mon?.avg || 178}만원</div>
        </div>

        <div class="mt-8 grid grid-cols-2 gap-4">
            ${Object.entries(salesData.mon?.categories || {}).map(([cat, val]) => `
                <div class="card bg-white rounded-3xl p-6">
                    <div class="text-teal-600 font-medium">${cat}</div>
                    <div class="text-4xl font-bold mt-3">${val.amount}</div>
                    <div class="text-sm text-gray-500">${val.percent}%</div>
                </div>
            `).join('')}
        </div>
    `;
    document.getElementById('sales-content').innerHTML = html;
}

function switchMainTab(n) {
    document.getElementById('main-tab0').classList.toggle('hidden', n !== 0);
    document.getElementById('main-tab1').classList.toggle('hidden', n !== 1);
    if (n === 1) renderSales();
}

// ==================== 시작 ====================
window.onload = loadData;
</script>
</body>
</html>
